[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mevolve"
version = "0.1.0"
description = "LLM-driven evolutionary discovery of interpretable cognitive models of mouse dynamic foraging"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "jax", "optax>=0.2.4"]

[project.optional-dependencies]
test = ["pytest", "aind-dynamic-foraging-models[rl] @ git+https://github.com/AllenNeuralDynamics/aind-dynamic-foraging-models@0c95b4b85c5f3d16c30d7dd297f3f2ee1325f112"]
# The search engine, pinned (ADR 0001); install into its own env (mevolve-search) so a running
# evaluator's env does not change under it.
search = ["shinka-evolve[wandb] @ git+https://github.com/SakanaAI/ShinkaEvolve@8adc053a2ce4511ad2ac310e004c530a73fb974a"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs a freeze on /allen (set MEVOLVE_FREEZE) and a studies checkout (MEVOLVE_STUDIES)"]
